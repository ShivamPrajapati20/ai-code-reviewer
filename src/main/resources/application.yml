spring:
  application:
    name: ai-code-reviewer
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    mcp:
      server:
        name: github-pr-reviwer
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: 8080

app:
  github:
    token: ${GITHUB_TOKEN}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET}
  claude:
    api-key: ${CLAUDE_API_KEY}
    model: claude-sonnet-4-20250514
    max-tokens: 2000
